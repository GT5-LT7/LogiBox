server:
  port: 19093

spring:
  application:
    name: catalog-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5443}/catalogdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:create-drop}
    show-sql: true

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true  # 이게 없으면 fallbackFactory 무시됨

feign:
  client:
    config:
      kakao-map-client:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic  # 운영 환경에서 API Key가 로그에 찍히는 보안 취약점 방어

kakao:
  map:
    auth-header: "KakaoAK ${KAKAO_API_KEY}"

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

management:
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"