server:
  port: 19093

spring:
  application:
    name: catalog-service
  data:
    redis:
      host: redis
      port: 6379
  datasource:
    url: jdbc:postgresql://catalog-db:5432/catalogdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true  # 이게 없으면 fallbackFactory 무시됨

feign:
  client:
    config:
      kakao-map-client:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic  # 운영 환경에서 API Key가 로그에 찍히는 보안 취약점 방어

kakao:
  map:
    auth-header: "KakaoAK ${KAKAO_API_KEY}"

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"