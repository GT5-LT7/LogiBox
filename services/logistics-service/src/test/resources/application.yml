spring:
  datasource:
    url: jdbc:tc:postgresql:16:///logisticsdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    enabled: false

kakao:
  local:
    base-url: https://dapi.kakao.com
    api-key: test-key
  mobility:
    base-url: https://apis-navi.kakaomobility.com
