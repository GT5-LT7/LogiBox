services:

  eureka-server:
    build: ./infrastructure/eureka-server
    ports:
      - "8761:8761"
    networks:
      - logibox-network

  api-gateway:
    build: ./infrastructure/api-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=your-secret-key-here-must-be-long-enough
    depends_on:
      - eureka-server
    networks:
      - logibox-network

  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5441:5432"
    networks:
      - logibox-network

  user-service:
    build: ./services/user-service
    ports:
      - "19091:19091"
    environment:
      - JWT_SECRET=your-secret-key-here-must-be-long-enough
    depends_on:
      - eureka-server
      - user-db
    networks:
      - logibox-network

networks:
  logibox-network:
    driver: bridge