server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # ── User Service ──────────────────────────
        # 회원가입 / 로그인 (인증 불필요)
        - id: user-public
          uri: lb://user-service
          predicates:
            - Path=/api/users/signup, /api/users/login
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: false

        # 회원가입 승인/거절 (MASTER, HUB_MANAGER)
        - id: user-approve
          uri: lb://user-service
          predicates:
            - Path=/api/users/signup/approve/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: true
                requiredRole: ROLE_HUB_MANAGER

        # 사용자 조회/수정/삭제 (인증 필요)
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: true

        # ── Hub Service ───────────────────────────
        - id: hub-service
          uri: lb://hub-service
          predicates:
            - Path=/api/hubs/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: true

        # ── Company Service ───────────────────────
        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/api/companies/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: true

        # ── Product Service ───────────────────────
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: true

        # ── Order Service ─────────────────────────
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: true

        # ── Delivery Service ──────────────────────
        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/api/deliveries/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: true

        # ── Slack AI Service ──────────────────────
        - id: slack-ai-service
          uri: lb://slack-ai-service
          predicates:
            - Path=/api/ai/**, /api/slack/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

jwt:
  secret: ${JWT_SECRET_KEY}

logging:
  level:
    org.springframework.cloud.gateway: INFO